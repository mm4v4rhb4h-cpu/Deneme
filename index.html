<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Blast - Evrimleşen Blok Bulmaca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #090d16; color: white; font-family: 'Inter', sans-serif; touch-action: none; overflow: hidden; }
        .grid-cell { width: 36px; height: 36px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; transition: all 0.2s; }
        .shape-cell { width: 24px; height: 24px; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen p-4 select-none">

    <!-- ÜST BİLGİ VE TEMA GÖSTERGESİ -->
    <header class="w-full max-w-md flex justify-between items-center bg-slate-900/80 backdrop-blur border border-slate-800 p-3 rounded-2xl shadow-xl">
        <div>
            <div class="text-[10px] text-slate-400 font-mono">SKOR</div>
            <div id="score" class="text-2xl font-extrabold text-cyan-400 font-mono">0</div>
        </div>
        <div class="text-center">
            <div class="text-[10px] text-slate-400 font-mono">MOD / TEMA</div>
            <div id="theme-name" class="text-xs font-bold text-amber-400">1. SEVİYE: NEON GECE</div>
        </div>
        <div>
            <div class="text-[10px] text-slate-400 font-mono">EN YÜKSEK</div>
            <div id="highscore" class="text-2xl font-extrabold text-emerald-400 font-mono">0</div>
        </div>
    </header>

    <!-- 8x8 OYUN TAHTASI -->
    <main class="flex flex-col items-center justify-center my-auto">
        <div id="board" class="grid grid-cols-8 gap-1.5 bg-slate-900/90 p-3 rounded-2xl border-2 border-slate-800 shadow-2xl"></div>
    </main>

    <!-- ALT BLOK SEÇENEKLERİ -->
    <footer class="w-full max-w-md bg-slate-900/80 backdrop-blur border border-slate-800 p-4 rounded-2xl shadow-xl flex justify-around items-center min-h-[110px]" id="shapes-container">
        <!-- Bloklar buraya dinamik gelecek -->
    </footer>

    <!-- OYUN BİTTİ EKRANI -->
    <div id="game-over-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex-col items-center justify-center p-6 z-50 text-center">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-xs w-full shadow-2xl space-y-4">
            <div class="w-16 h-16 bg-red-500/20 text-red-500 rounded-2xl flex items-center justify-center mx-auto text-3xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h2 class="text-xl font-bold text-white">HAMLE KALMADI!</h2>
            <p class="text-xs text-slate-400">Tahta doldu ve yeni blok sığmıyor.</p>
            <button onclick="resetGame()" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl shadow-lg transition">TEKRAR DENE</button>
        </div>
    </div>

    <!-- OYUN MANTIĞI VE EVRİM SİSTEMİ -->
    <script>
        const GRID_SIZE = 8;
        let board = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill(0));
        let score = 0;
        let highscore = 0;
        let currentShapes = [];

        // Skorlara Göre Evrilen Renk Paletleri ve Temalar
        const themes = [
            { threshold: 0, name: "1. SEVİYE: NEON GECE", colors: ['#38bdf8', '#818cf8', '#c084fc'] },
            { threshold: 300, name: "2. SEVİYE: SİBERPUNK", colors: ['#f43f5e', '#fb923c', '#facc15'] },
            { threshold: 800, name: "3. SEVİYE: DİGİTAL ORMAN", colors: ['#34d399', '#22d3ee', '#10b981'] },
            { threshold: 1500, name: "4. SEVİYE: ALTIN ÇAĞ", colors: ['#fbbf24', '#f59e0b', '#d97706'] }
        ];

        const SHAPES = [
            [[1]], // Tekli
            [[1, 1]], // 2 yatay
            [[1], [1]], // 2 dikey
            [[1, 1, 1]], // 3 yatay
            [[1], [1], [1]], // 3 dikey
            [[1, 1], [1, 1]], // 2x2 Kare
            [[1, 1, 1], [0, 1, 0]], // T şekli
            [[1, 0], [1, 1]] // L şekli
        ];

        function getCurrentTheme() {
            let activeTheme = themes[0];
            for (let t of themes) {
                if (score >= t.threshold) activeTheme = t;
            }
            return activeTheme;
        }

        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell flex items-center justify-center';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    if (board[r][c] !== 0) {
                        cell.style.background = board[r][c];
                        cell.style.borderColor = board[r][c];
                        cell.style.boxShadow = `0 0 10px ${board[r][c]}`;
                    }
                    boardEl.appendChild(cell);
                }
            }
        }

        function getRandomColor() {
            const theme = getCurrentTheme();
            return theme.colors[Math.floor(Math.random() * theme.colors.length)];
        }

        function generateShapes() {
            currentShapes = [];
            for (let i = 0; i < 3; i++) {
                const randomShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                currentShapes.push({
                    matrix: randomShape,
                    color: getRandomColor()
                });
            }
            renderShapes();
            checkGameOver();
        }

        function renderShapes() {
            const container = document.getElementById('shapes-container');
            container.innerHTML = '';
            currentShapes.forEach((shape, index) => {
                if (!shape) return;
                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col items-center justify-center p-2 cursor-pointer bg-slate-950/60 border border-slate-800 rounded-xl hover:border-cyan-500 transition';
                wrapper.onclick = () => selectShape(index);

                const table = document.createElement('div');
                table.className = 'grid gap-1';
                table.style.gridTemplateColumns = `repeat(${shape.matrix[0].length}, 24px)`;

                shape.matrix.forEach(row => {
                    row.forEach(val => {
                        const cell = document.createElement('div');
                        cell.className = 'shape-cell';
                        if (val === 1) {
                            cell.style.background = shape.color;
                            cell.style.boxShadow = `0 0 8px ${shape.color}`;
                        }
                        table.appendChild(cell);
                    });
                });
                wrapper.appendChild(table);
                container.appendChild(wrapper);
            });
        }

        let selectedShapeIndex = null;
        function selectShape(index) {
            selectedShapeIndex = index;
            // Görsel olarak seçildiğini belirt
            const containers = document.getElementById('shapes-container').children;
            for(let i=0; i<containers.length; i++) {
                containers[i].style.borderColor = i === index ? '#06b6d4' : '#1e293b';
            }
        }

        // Tahtaya tıklama ile yerleştirme (Mobil/Tablet dostu)
        document.getElementById('board').addEventListener('click', e => {
            const cell = e.target.closest('.grid-cell');
            if (!cell || selectedShapeIndex === null) return;

            const r = parseInt(cell.dataset.row);
            const c = parseInt(cell.dataset.col);
            const shape = currentShapes[selectedShapeIndex];

            if (canPlace(shape.matrix, r, c)) {
                placeShape(shape.matrix, r, c, shape.color);
                currentShapes[selectedShapeIndex] = null;
                selectedShapeIndex = null;
                score += 10;
                checkLines();
                initBoard();
                renderShapes();

                // Tema güncelleme kontrolü
                const theme = getCurrentTheme();
                document.getElementById('theme-name').innerText = theme.name;

                if (currentShapes.every(s => s === null)) {
                    generateShapes();
                }
            }
        });

        function canPlace(matrix, startR, startC) {
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[r].length; c++) {
                    if (matrix[r][c] === 1) {
                        let targetR = startR + r;
                        let targetC = startC + c;
                        if (targetR >= GRID_SIZE || targetC >= GRID_SIZE || board[targetR][targetC] !== 0) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function placeShape(matrix, startR, startC, color) {
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[r].length; c++) {
                    if (matrix[r][c] === 1) {
                        board[startR + r][startC + c] = color;
                    }
                }
            }
        }

        function checkLines() {
            let linesCleared = 0;
            // Satır kontrolü
            for (let r = 0; r < GRID_SIZE; r++) {
                if (board[r].every(cell => cell !== 0)) {
                    board[r] = Array(GRID_SIZE).fill(0);
                    linesCleared++;
                }
            }
            // Sütun kontrolü
            for (let c = 0; c < GRID_SIZE; c++) {
                let full = true;
                for (let r = 0; r < GRID_SIZE; r++) {
                    if (board[r][c] === 0) full = false;
                }
                if (full) {
                    for (let r = 0; r < GRID_SIZE; r++) {
                        board[r][c] = 0;
                    }
                    linesCleared++;
                }
            }

            if (linesCleared > 0) {
                score += linesCleared * 100 * linesCleared; // Kombo Çarpanı
                document.getElementById('score').innerText = score;
                if (score > highscore) {
                    highscore = score;
                    document.getElementById('highscore').innerText = highscore;
                }
            }
        }

        function checkGameOver() {
            // Eğer kalan hiçbir şekil tahtaya sığmıyorsa oyun biter
            let possible = false;
            currentShapes.forEach(shape => {
                if (!shape) return;
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (canPlace(shape.matrix, r, c)) possible = true;
                    }
                }
            });

            if (!possible && currentShapes.some(s => s !== null)) {
                document.getElementById('game-over-modal').classList.remove('hidden');
                document.getElementById('game-over-modal').classList.add('flex');
            }
        }

        function resetGame() {
            board = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill(0));
            score = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('game-over-modal').classList.remove('flex');
            document.getElementById('game-over-modal').classList.add('hidden');
            initBoard();
            generateShapes();
        }

        // Oyunu Başlat
        initBoard();
        generateShapes();
    </script>
</body>
</html>
