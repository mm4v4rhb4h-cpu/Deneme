<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--p1:#22d3ee;--p2:#f472b6;--gold:#facc15;--tx:#f1f5ff;--mu:#9aa6c8;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;background:var(--bgi);background-attachment:fixed}
#app{max-width:520px;margin:0 auto;padding:46px 12px 12px}
h1{margin:4px 0;text-align:center;font-size:30px;letter-spacing:1px;background:linear-gradient(90deg,var(--p1),var(--gold),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mu);font-size:13px;margin:0 0 12px}
.names{display:flex;gap:8px;margin-bottom:12px}
input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--inp);color:var(--tx);font-size:16px;font-weight:700;text-align:center}
.names input{border-color:var(--p1)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;color:var(--tx);text-align:center;cursor:pointer;padding:14px 6px;font-size:14px;font-weight:600}
.card span{display:block;font-size:34px;margin-bottom:4px}
.g3 .card{padding:10px 4px;font-size:12px}.g3 .card span{font-size:26px}
.card:active{transform:scale(.96)}
.btn{width:100%;padding:14px;border:0;border-radius:14px;font-size:16px;font-weight:800;color:var(--btt);background:var(--btn);cursor:pointer;margin-top:10px}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.pl{border-radius:18px;padding:10px;background:var(--card);border:2px solid var(--bd);transition:.2s}
.pl.a{--c:var(--p1)}.pl.b{--c:var(--p2)}
.pl.on{border-color:var(--c);box-shadow:0 0 18px -2px var(--c)}
.hd{display:flex;justify-content:space-between;font-weight:800;font-size:17px}
.hd i{font-style:normal;color:var(--gold)}
.ship{font-size:26px;min-height:44px;line-height:1.2}
.ship b{font-size:36px;margin-right:4px}

.box div{padding:1px 0}.box em{color:var(--mu);font-style:normal}
.bb{display:flex;gap:8px;margin-top:8px}
.bb button{flex:1;padding:13px 0;border:0;border-radius:12px;font-size:17px;font-weight:800;cursor:pointer;color:var(--bbt);background:var(--c)}
.bb button.pas{background:transparent;border:2px solid var(--bd);color:var(--tx)}
.bb button:disabled{opacity:.25}
.mid{text-align:center;padding:8px 0}
.em{font-size:84px;line-height:1.05}.pop{animation:pop .4s}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.nm{font-size:20px;font-weight:800}
.price{font-size:40px;font-weight:900;color:var(--gold);text-shadow:0 0 14px rgba(250,204,21,.5)}
.mu{color:var(--mu);font-size:13px}
.res{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0;white-space:pre-wrap;line-height:1.5}
.back{background:none;border:0;color:var(--mu);font-size:15px;padding:6px 0;cursor:pointer}
.rar{display:inline-block;font-size:12px;font-weight:800;border:1px solid;border-radius:20px;padding:2px 10px;margin:2px 0}
.toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1e293b;border:1px solid #facc15;color:#fff;padding:12px;border-radius:12px;z-index:20;text-align:center;font-size:14px}
.fl{position:fixed;bottom:18%;font-size:42px;pointer-events:none;z-index:15;animation:up 1.8s ease-out forwards}
@keyframes up{to{transform:translateY(-55vh) rotate(20deg);opacity:0}}
.rx{display:flex;justify-content:center;gap:6px;margin:8px 0}.rx button{font-size:22px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;cursor:pointer}

.th-sky{--bgi:linear-gradient(#a9dcff,#e6f6ff 55%,#d4f0c8);--tx:#12263f;--mu:#4b6580;--card:rgba(255,255,255,.88);--bd:#a9cde8;--p1:#0284c7;--p2:#db2777;--gold:#a16207;--inp:#fff;--btn:linear-gradient(90deg,#22c55e,#0ea5e9);--btt:#fff;--bbt:#fff;color-scheme:light}

.th-night{--bgi:radial-gradient(circle at 20% 0%,#2b1b6b 0,transparent 45%),radial-gradient(circle at 90% 100%,#0b4a6e 0,transparent 45%),#0a0d24;--tx:#f1f5ff;--mu:#9aa6c8;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--p1:#22d3ee;--p2:#f472b6;--gold:#facc15;--inp:rgba(0,0,0,.35);--btn:linear-gradient(90deg,#facc15,#f59e0b);--btt:#10122b;--bbt:#10122b;color-scheme:dark}
#tools{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;display:flex;gap:6px;z-index:12}#tools button{font-size:18px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;cursor:pointer;color:var(--tx)}
.bb .mn{flex:.5}
</style></head><body><div id="tools"><button id="tt" title="Renk teması">🎨</button><button id="ts" title="Ses">🔊</button></div><div id="app"></div>

function wav(f,d,ty,v){const k=f+"|"+d+"|"+ty+"|"+v;if(WC[k])return WC[k];const sr=22050,n=Math.floor(sr*d),b=new Uint8Array(44+n),w=new DataView(b.buffer);const W=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i)};W(0,"RIFF");w.setUint32(4,36+n,true);W(8,"WAVEfmt ");w.setUint32(16,16,true);w.setUint16(20,1,true);w.setUint16(22,1,true);w.setUint32(24,sr,true);w.setUint32(28,sr,true);w.setUint16(32,1,true);w.setUint16(34,8,true);W(36,"data");w.setUint32(40,n,true);for(let i=0;i<n;i++){const t=i/sr,ph=(t*f)%1;let x=ty=="square"?(ph<.5?1:-1):ty=="sine"?Math.sin(2*Math.PI*ph):4*Math.abs(ph-.5)-1;x*=v*Math.exp(-4*t/d)*(i<150?i/150:1);b[44+i]=Math.max(0,Math.min(255,Math.round(128+x*127)))}return WC[k]=URL.createObjectURL(new Blob([b],{type:"audio/wav"}))}
