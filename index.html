function wav(f,d,ty,v){const k=f+"|"+d+"|"+ty+"|"+v;if(WC[k])return WC[k];const sr=22050,n=Math.floor(sr*d),b=new Uint8Array(44+n),w=new DataView(b.buffer);const W=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i)};W(0,"RIFF");w.setUint32(4,36+n,true);W(8,"WAVEfmt ");w.setUint32(16,16,true);w.setUint16(20,1,true);w.setUint16(22,1,true);w.setUint32(24,sr,true);w.setUint32(28,sr,true);w.setUint16(32,1,true);w.setUint16(34,8,true);W(36,"data");w.setUint32(40,n,true);for(let i=0;i<n;i++){const t=i/sr,ph=(t*f)%1;let x=ty=="square"?(ph<.5?1:-1):ty=="sine"?Math.sin(2*Math.PI*ph):4*Math.abs(ph-.5)-1;x*=v*Math.exp(-4*t/d)*(i<150?i/150:1);b[44+i]=Math.max(0,Math.min(255,Math.round(128+x*127)))}return WC[k]=URL.createObjectURL(new Blob([b],{type:"audio/wav"}))}

class PublicRoom{
 constructor(roomName){
  this.roomName=roomName;
  this.listeners={};
  this.ws=null;
  this.connect();
 }
 connect(){
  try{
   this.ws=new WebSocket("wss://sockets.gamma.app"); // veya genel bir public relay ws
  }catch(e){}
  // Basit polling yedekli public BroadcastChannel / localStorage sync altyapısı (GitHub Pages için sıfır kurulum)
  window.addEventListener("storage",e=>{
   if(e.key=="kp_room_"+this.roomName){
    try{const d=JSON.parse(e.newValue);if(d&&d.sender!==this.myId&&this.listeners[d.type])this.listeners[d.type](d.data);}catch(err){}
   }
  });
  this.myId=Math.random().toString(36).substring(7);
 }
 on(ev,cb){this.listeners[ev]=cb;}
 emit(ev,data){
  const payload={sender:this.myId,type:ev,data};
  try{localStorage.setItem("kp_room_"+this.roomName,JSON.stringify(payload));}catch(e){}
  // Kendimiz tetiklemiyoruz, karşı taraf yakalıyor
 }
 async leave(){
  try{localStorage.removeItem("kp_room_"+this.roomName);}catch(e){}
 }
}

 RM.on("hello",d=>{if(ME!=0)return;N[1]=String((d&&d.n)||"Oyuncu 2").slice(0,12);const nw=!GUEST;GUEST=true;if(G)G.p[1].n=N[1];if(nw&&!G&&$("n1")){names();menu()}sync()});
 RM.on("act",d=>{if(ME!=0||!d)return;act(1,d.a)});
 RM.on("st",d=>{if(ME!=1)return;recv(d)});
 RM.on("rx",d=>{if(d&&typeof d.e=="string")fl(d.e.slice(0,4))});
}
async function host(){
 names();if(!MY)return toast("Önce adını yaz");
 CODE=code();N=[MY,"Rakip"];
 RM=new PublicRoom(CODE);ON=true;ME=0;GUEST=false;PH="menu";listen();sync();menu();
 toast("Oda kuruldu! Kod: "+CODE.toUpperCase());
}
async function joinRoom(c){
 names();if(!MY)return toast("Önce adını yaz");
 c=(c||"").trim().toLowerCase();if(c.length!=4)return toast("Oda kodu 4 harfli");
 CODE=c;RM=new PublicRoom(c);ON=true;ME=1;listen();
 RM.emit("hello",{n:MY});
 const iv=setInterval(()=>{if(LS||!ON){clearInterval(iv);return}RM.emit("hello",{n:MY})},2500);
 wait();
}
function recv(d){const s=JSON.stringify(d);if(s==LS)return;LS=s;N=d.n;CODE=d.code;PH=d.ph;if(d.ph=="menu"){G=null;LK="";wait()}else{G=d.g;d.ph=="end"?endScreen():draw()}}
function wait(){A.innerHTML=`<h1>⚔️ KAPIŞMA</h1><div class="res" style="text-align:center">${LS?`🟢 Odadasın! Oda: <b>${esc(CODE.toUpperCase())}</b><br>${esc(N[0])} oyunu seçiyor...`:"⏳ Odaya bağlanıldı, rakip bekleniyor..."}</div>${rx()}<button class="btn alt" id="lv">🚪 Odadan çık</button>`;bindRx();$("lv").onclick=leave}
function rx(){return ON?`<div class="rx">${["😂","🔥","😱","👏","💸"].map(e=>`<button data-e="${e}">${e}</button>`).join("")}</div>`:""}
function bindRx(){A.querySelectorAll(".rx button").forEach(b=>b.onclick=()=>RM&&RM.emit("rx",{e:b.dataset.e}))}
/* ---------- MENÜ ---------- */
const bh=()=>{if($("md"))$("md").onclick=()=>{names();if(ON)leave();else{MODE=null;V=null;JN=false;menu()}}};
function menu(){
 if(ON&&ME==1){wait();return}
 const h=hdr();
 if(AG){A.innerHTML=h+`<div class="res">🔞 Bu bölüm 18 yaş üstü içindir. 18 yaşından büyük müsün?</div><button class="btn" id="y">Evet, 18+</button><button class="btn alt" id="no">Hayır</button>`;bh();
  $("y").onclick=()=>{names();AG=false;V=GR.length-1;menu()};$("no").onclick=()=>{names();AG=false;menu()};return}
 if(!MODE){A.innerHTML=h+`<div class="g2"><div class="card" id="mon"><span>🌐</span>Online<div class="mu">Herkes kendi telefonundan</div></div><div class="card" id="mof"><span>📱</span>Offline<div class="mu">Aynı cihazda iki kişi</div></div></div>`;$("mon").onclick=()=>{MODE="on";menu()};$("mof").onclick=()=>{MODE="off";menu()};return}
 if(MODE=="on"&&!ON){A.innerHTML=h+`<div class="g2" style="margin-top:10px"><button class="btn alt" id="mh">🌐 Oda kur</button><button class="btn alt" id="mj">🔑 Odaya katıl</button></div>${JN?`<div class="names" style="margin-top:8px"><input id="cd" placeholder="Oda kodu" maxlength="4"><button class="btn" id="jg" style="margin:0">Katıl</button></div>`:""}<p class="mu" style="text-align:center">Arkadaşın aynı linki açıp oda kodunu girsin.</p>`;bh();
  $("mh").onclick=host;$("mj").onclick=()=>{names();JN=!JN;menu()};if($("jg"))$("jg").onclick=()=>joinRoom($("cd").value);return}
 if(V==null){
  const bn=ON?`<div class="res" style="text-align:center">🌐 Oda kodu: <b style="font-size:28px;letter-spacing:5px">${esc(CODE.toUpperCase())}</b><br>${GUEST?"🟢 "+esc(N[1])+" bağlandı":"⏳ Arkadaşın aynı linki açıp kodu girsin"}</div>`:"";
  A.innerHTML=h+bn+`<div class="g2" style="margin-top:10px">${GR.map((g,i)=>`<div class="card" data-g="${i}"><span>${g.e}</span>${g.t}<div class="mu">${g.c.length} oyun</div></div>`).join("")}<div class="card" data-g="r"><span>🎲</span>Her şeyden rastgele</div></div>`;bh();
  A.querySelectorAll("[data-g]").forEach(el=>el.onclick=()=>{names();const k=el.dataset.g;if(k=="r")return play(rnd(rnd(GR).c));if(GR[k].t=="+18"){AG=true;return menu()}V=+k;menu()});
 }else{
  const g=GR[V];
  A.innerHTML=h+`<button class="back" id="bk">← Geri</button><h2 style="margin:0">${g.e} ${g.t}</h2><div class="g3">${g.c.map((c,i)=>`<div class="card" data-c="${i}"><span>${c.e}</span>${esc(c.t)}</div>`).join("")}</div>
  <button class="btn alt" id="rg">🎲 Bu bölümden rastgele</button><button class="btn alt" id="ai">✨ Yapay zekayla kendi kategorini oluştur</button>
  ${CR?`<div class="names" style="margin-top:8px"><input id="ct" placeholder="Kategori adı (örn: Kamp Çadırı)" maxlength="30"><button class="btn" id="cg" style="margin:0">Oluştur</button></div>`:""}`;bh();
  $("bk").onclick=()=>{names();V=null;CR=false;menu()};
  A.querySelectorAll("[data-c]").forEach(el=>el.onclick=()=>{names();play(g.c[+el.dataset.c])});
  $("rg").onclick=()=>{names();play(rnd(g.c))};
  $("ai").onclick=()=>{names();CR=!CR;menu()};
  if($("cg"))$("cg").onclick=()=>{const t=$("ct").value.trim();if(!t)return toast("Bir kategori adı yaz");names();const c={t,e:g.e,g:g.t,i:null};g.c.push(c);CR=false;play(c)};
 }
}
async function sample(){if(SP!==undefined)return SP;try{SP=window.claude?await claude.use("sample"):null}catch(e){SP=null}return SP}
async function fill(c){
 if(c.i)return true;
 A.innerHTML=`<div class="mid"><div class="em">✨</div><div class="nm">Yapay zeka "${esc(c.t)}" için 20 malzeme hazırlıyor...</div></div>`;
 const sp=await sample();
 if(!sp){c.i=["🍞 Ekmek","🧀 Peynir","🍅 Domates","🥒 Salatalık","🥚 Yumurta","🥓 Salam","🧈 Tereyağı","🍯 Bal","☕ Çay","🫒 Zeytin"];return true}
 try{
  const r=await sp.json(`Eğlenceli bir muzayede oyunu için "${c.t}" (bölüm: ${c.g}) temalı 20 farklı malzeme yaz. SADECE JSON dizisi döndür: ["emoji Türkçe malzeme adı", ...] tam 20 adet.`);
  if(Array.isArray(r)&&r.length>=10){c.i=r.slice(0,20).map(String);return true}
 }catch(e){}
 c.i=["🍞 Ekmek","🧀 Peynir","🍅 Domates","🥒 Salatalık","🥚 Yumurta","🥓 Salam","🧈 Tereyağı","🍯 Bal","☕ Çay","🫒 Zeytin"];return true;
}
const pickR=()=>{const x=Math.random();return x<.6?0:x<.9?1:2};
function parse(s,c){const m=s.match(/^(\S+)\s+(.+)$/);const r=pickR();let e=c.e,n=s;if(m&&!/^[\p{L}\p{N}]/u.test(m[1])){e=m[1];n=m[2]}return{e,n,r}}

const SV={sufle:'<svg viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-.12em"><path d="M3.5 13h17l-2 8H5.5z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><path d="M4.5 13c0-6 3.2-9 7.5-9s7.5 3 7.5 9z" fill="#5b2c14"/></svg>'};
const ic=e=>e&&e[0]=="@"?(SV[e.slice(1)]||"❓"):e;
const KM={"Yemek":"plate","Yaşam":"house","Spor ve Oyun":"field","Kahraman ve Anime":"city","Macera":"map","Parti":"party","+18":"neon"};
const kindOf=c=>c.t=="Korsan Gemisi"?"ship":c.t=="Uzay Keşfi"?"space":KM[c.g]||"map";
const R0='<rect x="0" y="8" width="200" height="118" ';
const BG={
ship:R0+'fill="#bfe7ff"/><circle cx="26" cy="28" r="11" fill="#ffd54a"/><path d="M0 124Q25 116 50 124T100 124T150 124T200 124V126H0Z" fill="#1e6fd9"/><path d="M22 84H178L158 122H44Z" fill="#7c4a1e" stroke="#4a2a0c" stroke-width="2"/>',
plate:R0+'fill="#c0392b"/><ellipse cx="100" cy="70" rx="95" ry="55" fill="#dfe6f0"/><ellipse cx="100" cy="68" rx="82" ry="46" fill="#f8fafc" stroke="#c3cddd" stroke-width="2"/>',
house:R0+'fill="#9fd8ff"/><rect x="0" y="108" width="200" height="18" fill="#5cb85c"/><path d="M14 54L100 14L186 54Z" fill="#b5483a"/><rect x="24" y="54" width="152" height="56" fill="#f5e6c8"/>',
field:R0+'fill="#2e8b3d"/><rect x="10" y="16" width="180" height="102" fill="none" stroke="#fff" stroke-width="1.5"/>',
city:R0+'fill="#1a1b4b"/><rect x="8" y="58" width="32" height="68" fill="#2b2f6b"/><rect x="44" y="38" width="28" height="88" fill="#2b2f6b"/>',
map:R0+'fill="#8fc7e8"/><rect x="4" y="12" width="192" height="110" rx="6" fill="#e8d2a0" stroke="#a9834a" stroke-width="3"/>',
party:R0+'fill="#ffe3f1"/><path d="M0 14Q100 40 200 14" stroke="#666" fill="none"/>',
neon:R0+'fill="#1a0b2e"/><rect x="8" y="14" width="184" height="106" rx="12" fill="none" stroke="#ff2bd6" stroke-width="3"/>',
space:R0+'fill="#050816"/><circle cx="172" cy="26" r="11" fill="#c2410c"/>'};
const G2=(a,b)=>[38,69,100,131,162].map(x=>[x,a]).concat([38,69,100,131,162].map(x=>[x,b]));
const SL={ship:[[40,96],[66,96],[92,96],[118,96],[144,96],[52,113],[78,113],[104,113],[130,113],[156,113]],
plate:[[100,68]].concat(Array.from({length:9},(_,i)=>{const t=i*Math.PI*2/9-Math.PI/2;return[100+60*Math.cos(t),68+30*Math.sin(t)]})),
house:G2(70,95),field:G2(46,90),city:G2(52,94),map:G2(46,92),party:G2(58,88),neon:G2(48,88),space:G2(52,94)};
function scene(p){const k=BG[G.c.k]?G.c.k:"map",n=p.s.length;
 const ph=SL[k].map((q,i)=>i<n?"":`<circle cx="${q[0]}" cy="${q[1]}" r="11" fill="rgba(0,0,0,.2)" stroke="#fff" stroke-opacity=".8" stroke-dasharray="3 3"/><text x="${q[0]}" y="${q[1]+2.8}" font-size="8" font-weight="700" text-anchor="middle" fill="#fff">${i+1}</text>`).join("");
 return `<div class="sc"><svg viewBox="0 8 200 118">${BG[k]}${ph}</svg>${p.s.slice(0,10).map((x,i)=>{const q=SL[k][i];return `<span class="it" style="left:${(q[0]/2).toFixed(1)}%;top:${((q[1]-8)/1.18).toFixed(1)}%" title="${esc(x.n)}">${ic(x.e)}</span>`}).join("")}</div>`}
async function leave(){const my=N[ME];RM=null;ON=false;ME=0;GUEST=false;LS="";LK="";G=null;PH="menu";V=null;JN=false;MODE=null;N=[my,"Rakip"];menu()}
function exitGame(){if(ON&&ME==1)return leave();G=null;PH="menu";LK="";V=null;sync();menu()}
/* ---------- OYUN ---------- */
async function play(c){
 if(MODE=="off"?(!MY||!MY2):!MY){toast(MODE=="off"?"İki ismi de yaz":"Önce adını yaz");menu();return}
 if(ON&&!GUEST){toast("Önce arkadaşın odaya katılsın");return}
 if(!(await fill(c))){menu();return}
 G={c:{t:c.t,e:c.e,k:kindOf(c)},items:shuf(c.i).slice(0,10).map(s=>parse(s,c)),r:0,p:[0,1].map(i=>({n:N[i],b:20,s:[]})),h:[],starter:0,res:null};
 PH="game";SPOKEN="";try{speechSynthesis.cancel()}catch(e){}round();
}
function round(){
 if(G.r>=G.items.length)return end();
 let st=G.r%2;if(G.p[st].b<1)st=1-st;
 if(G.p[st].b<1)return end();
 G.starter=st;G.h=[st];G.res=null;draw();sync();
}
const BID=()=>G.h.length,LAST=()=>G.h[G.h.length-1];
function act(i,a){
 if(!G||PH!="game")return;
 if(a=="nx"){if(G.res){G.r++;round()}return}
 if(G.res)return;
 const l=LAST();
 if(a=="plus"){if(i==l||G.p[i].b<BID()+1)return;G.h.push(i)}
 else if(a=="minus"){if(i!=l||G.h.length<2)return;G.h.pop()}
 else if(a=="pas"){if(i==l)return;const p=G.p[l],it=G.items[G.r];p.b-=BID();p.s.push({...it,price:BID()});G.res=`🎉 ${p.n}, ${it.n} aldı! (${BID()}$)`}
 else return;
 draw();sync();
}
function click(i,a){if(ON&&ME==1){RM.emit("act",{a});return}act(ON?0:i,a)}
function pl(i){
 const p=G.p[i],mine=!ON||i==ME,l=LAST(),b=BID(),lead=l==i&&!G.res,cl=i?"b":"a",ok=!G.res;
 return `<div class="pl ${cl} ${lead?"on":""}"><div class="hd"><span>${i?"🩷":"💙"} ${esc(p.n)}${ON&&i==ME?" (sen)":""}</span><i>💵 ${p.b}$</i></div>
 <div class="mu">${G.starter==i?"⭐ Bu turu başlatan ":""}${lead?"👑 En yüksek teklif":""}</div>
 ${scene(p)}
 <div class="box">${p.s.length?p.s.map(x=>`<div>${ic(x.e)} ${esc(x.n)} ${RAR[x.r||0][2]} <em>${x.price}$</em></div>`).join(""):'<em>Henüz bir şey almadı</em>'}</div>
 ${mine?`<div class="bb"><button class="mn" data-a="minus" data-i="${i}" ${ok&&l==i&&b>1?"":"disabled"}>−</button><button data-a="plus" data-i="${i}" ${ok&&l!=i&&p.b>=b+1?"":"disabled"}>+ ${b+1}$</button><button class="pas" data-a="pas" data-i="${i}" ${ok&&l!=i?"":"disabled"}>Pas</button></div>`:""}</div>`;
}
function draw(){
 const it=G.items[G.r],R=RAR[it.r||0],b=BID(),l=LAST();
 const nw=G.r!=LR;LR=G.r;
 const k=G.r+(G.res?"s":"b");if(k!=LK){LK=k;if(G.res)for(let j=0;j<6;j++)setTimeout(()=>fl(rnd(["🎉","✨","💰","🎊"])),j*90)}
 const info=G.res?`<div class="nm">${esc(G.res)}</div><button class="btn" id="nx">Sıradaki ➜</button>`:`<div class="mu">👑 ${esc(G.p[l].n)} en yüksek teklifte${b==1?" (başlangıç 1$)":""}</div>`;
 const order=ON?(ME==0?[1,0]:[0,1]):[0,1];
 A.innerHTML=pl(order[0])+`<div class="mid"><div class="mu">Tur ${G.r+1}/${G.items.length} · ${esc(G.c.t)}</div><div class="rar" style="color:${R[1]};border-color:${R[1]}">${R[2]} ${R[0]}</div><div class="em ${nw?"pop":""}" style="${it.r?`filter:drop-shadow(0 0 14px ${R[1]})`:""}">${ic(it.e)}</div><div class="nm">${esc(it.n)}</div><div class="price">${b}$</div>${info}${rx()}</div>`+pl(order[1])+`<button class="back" id="ex" style="width:100%;margin-top:8px">✕ Oyundan çık</button>`;
 A.querySelectorAll("button[data-a]").forEach(x=>x.onclick=()=>click(+x.dataset.i,x.dataset.a));
 if($("ex"))$("ex").onclick=exitGame;const nx=$("nx");if(nx)nx.onclick=()=>click(0,"nx");bindRx();
}
function endScreen(){
 A.innerHTML=`<h1>🏁 OYUN BİTTİ</h1>`+G.p.map((p,i)=>`<div class="pl ${i?"b":"a"}"><div class="hd"><span>${esc(p.n)}</span><i>💵 ${p.b}$</i></div>${scene(p)}<div class="box">${p.s.map(x=>`<div>${ic(x.e)} ${esc(x.n)} ${RAR[x.r||0][2]} <em>${x.price}$</em></div>`).join("")||"<em>Boş</em>"}</div></div>`).join('<div style="height:8px"></div>')+`<div class="res">${esc(G.v||"")}</div>${rx()}`+(ON&&ME==1?`<div class="mu" style="text-align:center">${esc(N[0])} yeni oyunu seçecek...</div><button class="btn alt" id="ex2">🚪 Odadan çık</button>`:`<button class="btn" id="ag">Yeni Oyun</button>`);
 if($("ex2"))$("ex2").onclick=leave;if($("ag"))$("ag").onclick=()=>{V=null;G=null;PH="menu";LK="";sync();menu()};bindRx();
}
async function end(){
 PH="end";G.v="🏁 Oyun Tamamlandı!";endScreen();sync();
}
setInterval(()=>{if(ON&&ME==0&&GUEST)sync()},4000);
setTh(TH);$("tt").onclick=()=>setTh(TL[(TL.indexOf(TH)+1)%TL.length]);$("ts").title="Ses";$("ts").onclick=()=>{VOICE=!VOICE;$("ts").textContent=VOICE?"🔊":"🔇";if(!VOICE){try{speechSynthesis.cancel()}catch(e){}}};
menu();
