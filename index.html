<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Red Ball Tarzı Web Oyunu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; touch-action: none; }
        canvas { background: linear-gradient(to bottom, #38bdf8, #bae6fd); display: block; margin: 0 auto; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5); }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen select-none">

    <!-- ÜST BİLGİ -->
    <div class="absolute top-4 w-full max-w-2xl px-4 flex justify-between items-center text-slate-900 font-bold z-10">
        <div class="bg-white/80 backdrop-blur px-4 py-1.5 rounded-full shadow text-sm">
            ❤️ CAN: <span id="ui-lives" class="text-red-600">3</span>
        </div>
        <div class="bg-white/80 backdrop-blur px-4 py-1.5 rounded-full shadow text-sm">
            ⭐ ALTIN: <span id="ui-score" class="text-amber-500">0</span> / 5
        </div>
    </div>

    <!-- OYUN ALANI (CANVAS) -->
    <div class="relative w-full max-w-2xl">
        <canvas id="gameCanvas" width="800" height="400" class="w-full rounded-2xl border-4 border-slate-700"></canvas>
        
        <!-- OYUN BİTTİ / KAZANDIN EKRANI (BAŞLANGIÇTA GİZLİ) -->
        <div id="game-overlay" class="absolute inset-0 bg-black/70 backdrop-blur-sm hidden flex-col items-center justify-center text-center p-6 rounded-2xl z-20">
            <h2 id="overlay-title" class="text-3xl font-extrabold text-white mb-2">OYUN BİTTİ</h2>
            <p id="overlay-desc" class="text-sm text-slate-300 mb-4">Tekrar denemek ister misin?</p>
            <button onclick="restartGame()" class="px-6 py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl shadow-lg transition">TEKRAR OYNA</button>
        </div>
    </div>

    <!-- MOBİL / TABLET DOKUNMATİK KONTROLLERİ -->
    <div class="w-full max-w-2xl px-4 mt-4 flex justify-between items-center z-10">
        <div class="flex space-x-3">
            <button ontouchstart="keys.left=true" ontouchend="keys.left=false" onmousedown="keys.left=true" onmouseup="keys.left=false" class="w-16 h-16 bg-slate-800 active:bg-slate-700 border-2 border-slate-600 rounded-2xl flex items-center justify-center text-2xl shadow-lg text-white">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button ontouchstart="keys.right=true" ontouchend="keys.right=false" onmousedown="keys.right=true" onmouseup="keys.right=false" class="w-16 h-16 bg-slate-800 active:bg-slate-700 border-2 border-slate-600 rounded-2xl flex items-center justify-center text-2xl shadow-lg text-white">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
        <button ontouchstart="keys.jump=true" ontouchend="keys.jump=false" onmousedown="keys.jump=true" onmouseup="keys.jump=false" class="w-20 h-16 bg-red-600 active:bg-red-500 border-2 border-red-400 rounded-2xl flex items-center justify-center text-xl font-bold shadow-lg text-white">
            Zıpla 🚀
        </button>
    </div>

    <!-- OYUN MOTORU KODLARI -->
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let keys = { left: false, right: false, jump: false };
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let gameWon = false;

        // Oyuncu (Kırmızı Top)
        let player = {
            x: 50, y: 250, radius: 20,
            vx: 0, vy: 0, speed: 4, jumpPower: -10,
            gravity: 0.5, grounded: false
        };

        // Zeminler, Engeller ve Altınlar
        let platforms = [
            { x: 0, y: 350, w: 900, h: 50 },  // Ana Zemin
            { x: 300, y: 260, w: 150, h: 20 }, // Platform 1
            { x: 550, y: 180, w: 150, h: 20 }  // Platform 2
        ];

        let spikes = [
            { x: 350, y: 330, w: 30, h: 20 },
            { x: 600, y: 160, w: 30, h: 20 }
        ];

        let coins = [
            { x: 365, y: 220, r: 10, collected: false },
            { x: 615, y: 140, r: 10, collected: false },
            { x: 750, y: 310, r: 10, collected: false }
        ];

        let flag = { x: 770, y: 270, w: 20, h: 80 };

        // Klavye Dinleyicileri (Bilgisayardan oynamak isteyenler için)
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
            if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
            if (e.key === "ArrowUp" || e.key === " " || e.key === "w") keys.jump = true;
        });
        window.addEventListener("keyup", e => {
            if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
            if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
            if (e.key === "ArrowUp" || e.key === " " || e.key === "w") keys.jump = false;
        });

        function update() {
            if (gameOver || gameWon) return;

            // Yatay Hareket
            if (keys.left) player.vx = -player.speed;
            else if (keys.right) player.vx = player.speed;
            else player.vx = 0;

            player.x += player.vx;

            // Yerçekimi
            player.vy += player.gravity;
            player.y += player.vy;
            player.grounded = false;

            // Zemin Çarpışmaları
            platforms.forEach(p => {
                if (player.x + player.radius > p.x && player.x - player.radius < p.x + p.w &&
                    player.y + player.radius > p.y && player.y - player.radius < p.y + p.h) {
                    // Üstten çarpma
                    if (player.vy > 0 && player.y - player.radius < p.y) {
                        player.y = p.y - player.radius;
                        player.vy = 0;
                        player.grounded = true;
                    }
                }
            });

            // Zıplama
            if (keys.jump && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
            }

            // Diken Çarpışmaları (Can Kaybı)
            spikes.forEach(s => {
                if (player.x + player.radius > s.x && player.x - player.radius < s.x + s.w &&
                    player.y + player.radius > s.y && player.y - player.radius < s.y + s.h) {
                    loseLife();
                }
            });

            // Altın Toplama
            coins.forEach(c => {
                if (!c.collected && Math.hypot(player.x - c.x, player.y - c.y) < player.radius + c.r) {
                    c.collected = true;
                    score++;
                    document.getElementById("ui-score").innerText = score;
                }
            });

            // Bitiş Bayrağı
            if (player.x + player.radius > flag.x && player.y + player.radius > flag.y) {
                gameWon = true;
                showOverlay("TEBRİKLER KAPTAN!", "Bölümü başarıyla tamamladın!");
            }

            // Ekran Dışı Düşme
            if (player.y > canvas.height) {
                loseLife();
            }
        }

        function loseLife() {
            lives--;
            document.getElementById("ui-lives").innerText = lives;
            if (lives <= 0) {
                gameOver = true;
                showOverlay("OYUN BİTTİ", "Canın bitti, tekrar dene!");
            } else {
                // Başlangıç noktasına resetle
                player.x = 50;
                player.y = 250;
                player.vx = 0;
                player.vy = 0;
            }
        }

        function showOverlay(title, desc) {
            document.getElementById("overlay-title").innerText = title;
            document.getElementById("overlay-desc").innerText = desc;
            document.getElementById("game-overlay").classList.remove("hidden");
            document.getElementById("game-overlay").classList.add("flex");
        }

        function restartGame() {
            lives = 3;
            score = 0;
            gameOver = false;
            gameWon = false;
            document.getElementById("ui-lives").innerText = lives;
            document.getElementById("ui-score").innerText = score;
            coins.forEach(c => c.collected = false);
            player.x = 50;
            player.y = 250;
            player.vx = 0;
            player.vy = 0;
            document.getElementById("game-overlay").classList.remove("flex");
            document.getElementById("game-overlay").classList.add("hidden");
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Zeminleri Çiz
            ctx.fillStyle = "#1e293b";
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
            });

            // Dikenleri Çiz
            ctx.fillStyle = "#ef4444";
            spikes.forEach(s => {
                ctx.beginPath();
                ctx.moveTo(s.x, s.y + s.h);
                ctx.lineTo(s.x + s.w / 2, s.y);
                ctx.lineTo(s.x + s.w, s.y + s.h);
                ctx.fill();
            });

            // Altınları Çiz
            coins.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = "#f59e0b";
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#d97706";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            // Bitiş Bayrağı Çiz
            ctx.fillStyle = "#94a3b8";
            ctx.fillRect(flag.x, flag.y, flag.w, flag.h);
            ctx.fillStyle = "#22c55e";
            ctx.fillRect(flag.x + flag.w, flag.y, 30, 20);

            // Oyuncuyu Çiz (Kırmızı Top)
            ctx.fillStyle = "#dc2626";
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#991b1b";
            ctx.lineWidth = 3;
            ctx.stroke();

            // Topun Gözleri (Red Ball havası)
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(player.x + 5, player.y - 4, 4, 0, Math.PI * 2);
            ctx.arc(player.x + 12, player.y - 4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(player.x + 6, player.y - 4, 1.5, 0, Math.PI * 2);
            ctx.arc(player.x + 13, player.y - 4, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
