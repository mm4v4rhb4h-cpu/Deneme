function wav(f,d,ty,v){const k=f+"|"+d+"|"+ty+"|"+v;if(WC[k])return WC[k];const sr=22050,n=Math.floor(sr*d),b=new Uint8Array(44+n),w=new DataView(b.buffer);const W=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i)};W(0,"RIFF");w.setUint32(4,36+n,true);W(8,"WAVEfmt ");w.setUint32(16,16,true);w.setUint16(20,1,true);w.setUint16(22,1,true);w.setUint32(24,sr,true);w.setUint32(28,sr,true);w.setUint16(32,1,true);w.setUint16(34,8,true);W(36,"data");w.setUint32(40,n,true);for(let i=0;i<n;i++){const t=i/sr,ph=(t*f)%1;let x=ty=="square"?(ph<.5?1:-1):ty=="sine"?Math.sin(2*Math.PI*ph):4*Math.abs(ph-.5)-1;x*=v*Math.exp(-4*t/d)*(i<150?i/150:1);b[44+i]=Math.max(0,Math.min(255,Math.round(128+x*127)))}return WC[k]=URL.createObjectURL(new Blob([b],{type:"audio/wav"}))}

class CrossSync{
 constructor(room){
  this.room=room;
  this.bc=new BroadcastChannel("kapisma_"+room);
  this.listeners={};
  this.lastT=0;
  this.bc.onmessage=e=>{if(e.data&&this.listeners[e.data.type])this.listeners[e.data.type](e.data.data)};
  this.iv=setInterval(()=>this.poll(),600);
 }
 on(ev,cb){this.listeners[ev]=cb;}
 send(ev,data){
  try{this.bc.postMessage({type:ev,data});}catch(e){}
  try{localStorage.setItem("kp_sync_"+this.room,JSON.stringify({t:Date.now(),type:ev,data}));}catch(e){}
 }
 poll(){
  try{
   const raw=localStorage.getItem("kp_sync_"+this.room);
   if(raw){
    const d=JSON.parse(raw);
    if(d&&d.t>this.lastT&&d.type){
     this.lastT=d.t;
     if(this.listeners[d.type])this.listeners[d.type](d.data);
    }
   }
  }catch(e){}
 }
 leave(){
  clearInterval(this.iv);
  try{this.bc.close();}catch(e){}
 }
}

function sync(){if(!ON||ME!=0||!CS)return;CS.send("state",{ph:PH,n:N,code:CODE,g:G?pack():null})}

function listen(){
 CS.on("hello",d=>{if(ME!=0)return;N[1]=String((d&&d.n)||"Oyuncu 2").slice(0,12);const nw=!GUEST;GUEST=true;if(G)G.p[1].n=N[1];if(nw&&!G&&$("n1")){names();menu()}sync()});
 CS.on("act",d=>{if(ME!=0||!d)return;act(1,d.a)});
 CS.on("state",d=>{if(ME!=1)return;recv(d)});
 CS.on("rx",d=>{if(d&&typeof d.e=="string")fl(d.e.slice(0,4))});
}

async function host(){
 names();if(!MY)return toast("Önce adını yaz");
 CODE=code();N=[MY,"Rakip"];
 if(CS)CS.leave();
 CS=new CrossSync(CODE);ON=true;ME=0;GUEST=false;PH="menu";listen();sync();menu();
 toast("Oda kuruldu! Kod: "+CODE.toUpperCase());
}

async function joinRoom(c){
 names();if(!MY)return toast("Önce adını yaz");
 c=(c||"").trim().toLowerCase();if(c.length!=4)return toast("Oda kodu 4 harfli");
 CODE=c;if(CS)CS.leave();
 CS=new CrossSync(c);ON=true;ME=1;listen();
 CS.send("hello",{n:MY});
 const iv=setInterval(()=>{if(LS||!ON){clearInterval(iv);return}CS.send("hello",{n:MY})},2000);
 wait();
}

function recv(d){const s=JSON.stringify(d);if(s==LS)return;LS=s;N=d.n;CODE=d.code;PH=d.ph;if(d.ph=="menu"){G=null;LK="";wait()}else{G=d.g;d.ph=="end"?endScreen():draw()}}
function wait(){A.innerHTML=`<h1>⚔️ KAPIŞMA</h1><div class="res" style="text-align:center">${LS?`🟢 Odadasın! Oda: <b>${esc(CODE.toUpperCase())}</b><br>${esc(N[0])} oyunu seçiyor...`:"⏳ Odaya bağlanıldı, rakip bekleniyor..."}</div>${rx()}<button class="btn alt" id="lv">🚪 Odadan çık</button>`;bindRx();$("lv").onclick=leave}
function rx(){return ON?`<div class="rx">${["😂","🔥","😱","👏","💸"].map(e=>`<button data-e="${e}">${e}</button>`).join("")}</div>`:""}
function bindRx(){A.querySelectorAll(".rx button").forEach(b=>b.onclick=()=>CS&&CS.send("rx",{e:b.dataset.e}))}

/* ---------- MENÜ ---------- */
const bh=()=>{if($("md"))$("md").onclick=()=>{names();if(ON)leave();else{MODE=null;V=null;JN=false;menu()}}};
function menu(){
 if(ON&&ME==1){wait();return}
 const h=hdr();
 if(AG){A.innerHTML=h+`<div class="res">🔞 Bu bölüm 18 yaş üstü içindir. 18 yaşından büyük müsün?</div><button class="btn" id="y">Evet, 18+</button><button class="btn alt" id="no">Hayır</button>`;bh();
  $("y").onclick=()=>{names();AG=false;V=GR.length-1;menu()};$("no").onclick=()=>{names();AG=false;menu()};return}
 if(!MODE){A.innerHTML=h+`<div class="g2"><div class="card" id="mon"><span>🌐</span>Online<div class="mu">Herkes kendi telefonundan</div></div><div class="card" id="mof"><span>📱</span>Offline<div class="mu">Aynı cihazda iki kişi</div></div></div>`;$("mon").onclick=()=>{MODE="on";menu()};$("mof").onclick=()=>{MODE="off";menu()};return}
 if(MODE=="on"&&!ON){A.innerHTML=h+`<div class="g2" style="margin-top:10px"><button class="btn alt" id="mh">🌐 Oda kur</button><button class="btn alt" id="mj">🔑 Odaya katıl</button></div>${JN?`<div class="names" style="margin-top:8px"><input id="cd" placeholder="Oda kodu" maxlength="4"><button class="btn" id="jg" style="margin:0">Katıl</button></div>`:""}<p class="mu" style="text-align:center">Arkadaşın aynı linki açıp oda kodunu girsin.</p>`;bh();
  $("mh").onclick=host;$("mj").onclick=()=>{names();JN=!JN;menu()};if($("jg"))$("jg").onclick=()=>joinRoom($("cd").value);return}
 if(V==null){
  const bn=ON?`<div class="res" style="text-align:center">🌐 Oda kodu: <b style="font-size:28px;letter-spacing:5px">${esc(CODE.toUpperCase())}</b><br>${GUEST?"🟢 "+esc(N[1])+" bağlandı":"⏳ Arkadaşın aynı linki açıp kodu girsin"}</div>`:"";
  A.innerHTML=h+bn+`<div class="g2" style="margin-top:10px">${GR.map((g,i)=>`<div class="card" data-g="${i}"><span>${g.e}</span>${g.t}<div class="mu">${g.c.length} oyun</div></div>`).join("")}<div class="card" data-g="r"><span>🎲</span>Her şeyden rastgele</div></div>`;bh();
  A.querySelectorAll("[data-g]").forEach(el=>el.onclick=()=>{names();const k=el.dataset.g;if(k=="r")return play(rnd(rnd(GR).c));if(GR[k].t=="+18"){AG=true;return menu()}V=+k;menu()});
 }else{
  const g=GR[V];
  A.innerHTML=h+`<button class="back" id="bk">← Geri</button><h2 style="margin:0">${g.e} ${g.t}</h2><div class="g3">${g.c.map((c,i)=>`<div class="card" data-c="${i}"><span>${c.e}</span>${esc(c.t)}</div>`).join("")}</div>
  <button class="btn alt" id="rg">🎲 Bu bölümden rastgele</button><button class="btn alt" id="ai">✨ Yapay zekayla kendi kategorini oluştur</button>
  ${CR?`<div class="names" style="margin-top:8px"><input id="ct" placeholder="Kategori adı (örn: Kamp Çadırı)" maxlength="30"><button class="btn" id="cg" style="margin:0">Oluştur</button></div>`:""}`;bh();
  $("bk").onclick=()=>{names();V=null;CR=false;menu()};
  A.querySelectorAll("[data-c]").forEach(el=>el.onclick=()=>{names();play(g.c[+el.dataset.c])});
  $("rg").onclick=()=>{names();play(rnd(g.c))};
  $("ai").onclick=()=>{names();CR=!CR;menu()};
  if($("cg"))$("cg").onclick=()=>{const t=$("ct").value.trim();if(!t)return toast("Bir kategori adı yaz");names();const c={t,e:g.e,g:g.t,i:null};g.c.push(c);CR=false;play(c)};
 }
}
async function sample(){if(SP!==undefined)return SP;try{SP=window.claude?await claude.use("sample"):null}catch(e){SP=null}return SP
