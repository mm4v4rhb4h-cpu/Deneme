<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Kaptan Simülatörü - Open Sea</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; overflow: hidden; background-color: #020617; font-family: 'Inter', sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        .hud-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(56, 189, 248, 0.2); }
    </style>
</head>
<body class="relative">

    <!-- 3D OYUN ALANI (CANVAS) -->
    <div id="canvas-container"></div>

    <!-- ÜST KÖPRÜÜSTÜ HUD BİLGİLERİ -->
    <div class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none z-10">
        <div class="hud-panel px-4 py-2.5 rounded-xl text-white shadow-xl flex items-center space-x-3 pointer-events-auto">
            <div class="w-9 h-9 rounded-lg bg-cyan-600 flex items-center justify-center text-white font-bold shadow-lg">
                <i class="fa-solid fa-anchor"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm tracking-wide text-cyan-400">3D KÖPRÜÜSTÜ KONTROLÜ</h1>
                <p class="text-[10px] text-slate-400 font-mono">TCS ATLANTIS // OPEN SEA 3D</p>
            </div>
        </div>

        <div class="hud-panel px-4 py-2 rounded-xl text-white shadow-xl font-mono text-xs flex space-x-4 pointer-events-auto">
            <div>HIZ: <span id="hud-speed" class="text-cyan-400 font-bold">0.0 kn</span></div>
            <div>ROTA: <span id="hud-heading" class="text-emerald-400 font-bold">045°</span></div>
        </div>
    </div>

    <!-- ALT KONTROL DÜĞMELERİ (DÜMEN VE GAZ) -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-full max-w-lg px-4 flex flex-col space-y-3 z-10 pointer-events-auto">
        <div class="hud-panel p-4 rounded-2xl shadow-2xl flex flex-col space-y-3">
            <div class="flex justify-between items-center text-xs text-slate-300 font-mono">
                <span>GAZ / MAKİNE GÜCÜ</span>
                <span id="throttle-val" class="text-cyan-400 font-bold">%0 (STOP)</span>
            </div>
            <!-- Gaz Kolu Slider -->
            <input type="range" min="0" max="100" value="0" class="w-full accent-cyan-500 cursor-pointer" id="throttle-slider" oninput="updateThrottle(this.value)">

            <!-- Dümen Butonları -->
            <div class="grid grid-cols-2 gap-3 pt-1">
                <button ontouchstart="setRudder(-1)" onmousedown="setRudder(-1)" ontouchend="setRudder(0)" onmouseup="setRudder(0)" class="py-3 rounded-xl bg-slate-800 hover:bg-slate-700 active:bg-cyan-600 text-white font-bold text-xs border border-slate-700 transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>İSKELE (PORT)</span>
                </button>
                <button ontouchstart="setRudder(1)" onmousedown="setRudder(1)" ontouchend="setRudder(0)" onmouseup="setRudder(0)" class="py-3 rounded-xl bg-slate-800 hover:bg-slate-700 active:bg-cyan-600 text-white font-bold text-xs border border-slate-700 transition flex items-center justify-center space-x-2">
                    <span>SANCAK (STARBOARD)</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 3D SAHNE JAVASCRIPT (THREE.JS) -->
    <script>
        let scene, camera, renderer, ship;
        let throttle = 0;
        let rudderDirection = 0;
        let shipSpeed = 0;
        let shipHeading = 45;
        let waves = [];

        function init3D() {
            // Sahne, Kamera, Renderer
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080f1e);
            scene.fog = new THREE.FogExp2(0x080f1e, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 12, 25);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Işıklandırma
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
            sunLight.position.set(50, 100, 50);
            scene.add(sunLight);

            // Deniz (Okyanus) Yüzeyi
            const oceanGeometry = new THREE.PlaneGeometry(500, 500, 64, 64);
            const oceanMaterial = new THREE.MeshStandardMaterial({
                color: 0x0284c7,
                roughness: 0.1,
                metalness: 0.8,
                flatShading: true
            });
            const ocean = new THREE.Mesh(oceanGeometry, oceanMaterial);
            ocean.rotation.x = -Math.PI / 2;
            scene.add(ocean);

            // 3D Gemi Modeli Oluşturma (Konteyner Gemisi Gövdesi)
            const shipGroup = new THREE.Group();

            // Gövde (Hull)
            const hullGeo = new THREE.BoxGeometry(4, 2, 12);
            const hullMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.3 });
            const hull = new THREE.Mesh(hullGeo, hullMat);
            hull.position.y = 1;
            shipGroup.add(hull);

            // Kırmızı Dip Boyası (Boot topping)
            const baseGeo = new THREE.BoxGeometry(4.1, 1, 12.1);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.4;
            shipGroup.add(base);

            // Köprüüstü (Superstructure)
            const bridgeGeo = new THREE.BoxGeometry(3, 2.5, 3);
            const bridgeMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc });
            const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
            bridge.position.set(0, 3.2, -3);
            shipGroup.add(bridge);

            // Konteynerler (Yük İstifi)
            for(let x = -1; x <= 1; x += 1.5) {
                for(let z = -1; z <= 3; z += 1.5) {
                    const contGeo = new THREE.BoxGeometry(1.3, 1.3, 1.3);
                    const colors = [0x2563eb, 0xdc2626, 0x16a34a, 0xd97706];
                    const contMat = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random()*colors.length)] });
                    const container = new THREE.Mesh(contGeo, contMat);
                    container.position.set(x, 2.6, z + 1);
                    shipGroup.add(container);
                }
            }

            ship = shipGroup;
            ship.position.set(0, 0, 0);
            scene.add(ship);

            // Pencere Boyutlandırma
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function updateThrottle(val) {
            throttle = parseInt(val);
            document.getElementById('throttle-val').innerText = throttle === 0 ? '%0 (STOP)' : `%${throttle}`;
        }

        function setRudder(dir) {
            rudderDirection = dir;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Gemi Hız ve Rota Hesapları
            shipSpeed = (throttle * 0.2);
            document.getElementById('hud-speed').innerText = (shipSpeed * 2.5).toFixed(1) + ' kn';

            if (rudderDirection !== 0) {
                shipHeading += rudderDirection * 0.8;
                if(shipHeading < 0) shipHeading += 360;
                if(shipHeading >= 360) shipHeading -= 360;
                document.getElementById('hud-heading').innerText = Math.round(shipHeading) + '°';
                ship.rotation.y = -THREE.MathUtils.degToRad(shipHeading);
            }

            // Gemiyi İleri Hareket Ettir
            const rad = THREE.MathUtils.degToRad(shipHeading);
            ship.position.x += Math.sin(rad) * (shipSpeed * 0.05);
            ship.position.z += Math.cos(rad) * (shipSpeed * 0.05);

            // Kamera Takibi (Köprüüstü Arkası Takip Kamerası)
            camera.position.x = ship.position.x - Math.sin(rad) * 20;
            camera.position.z = ship.position.z - Math.cos(rad) * 20;
            camera.position.y = ship.position.y + 8 + Math.sin(Date.now() * 0.003) * 0.2; // Hafif dalga salınımı
            camera.lookAt(ship.position.x, ship.position.y + 2, ship.position.z);

            renderer.render(scene, camera);
        }

        window.onload = init3D;
    </script>
</body>
</html>
